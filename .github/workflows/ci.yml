name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check assignments
        run: |
          set -e
          for dir in assignments/*/; do
            echo "=== $dir ==="
            (
              cd "$dir"
              test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
              go vet ./...
              go test -race ./...
            )
          done
